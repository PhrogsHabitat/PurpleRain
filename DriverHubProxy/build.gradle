apply plugin: 'com.android.application'

android {
    namespace 'org.firstinspires.ftc.driverhubproxy'
    compileSdk 35

    defaultConfig {
        applicationId "org.firstinspires.ftc.driverhubproxy"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
